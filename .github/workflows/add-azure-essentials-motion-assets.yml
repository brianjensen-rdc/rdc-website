name: Add Azure Essentials motion assets (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-azure-essentials-motion-assets.yml'

permissions:
  contents: write

jobs:
  add-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download motion assets from Squarespace CDN
        run: |
          set -e
          SITE_ID="678693bf6fa87d3625a6a5ef"
          mkdir -p src/media/case-studies/azure-essentials
          curl -sS -f -o "src/media/case-studies/azure-essentials/event-style-guide-animated.gif" \
            "https://images.squarespace-cdn.com/content/${SITE_ID}/210bf3da-f5c3-4b46-b76e-07780cd6e85d/5Event%20style%20guide_AzureEssentialsTechAccelerator.gif?content-type=image%2Fgif"
          curl -sS -f -o "src/media/case-studies/azure-essentials/resource-kit-update.gif" \
            "https://images.squarespace-cdn.com/content/${SITE_ID}/b29514a8-aeac-40b1-8e0c-4c60e7ab6206/OCT25_azure-essentials-resource-kit-DesignUpdate.gif?content-type=image%2Fgif"
          curl -sS -f -o "src/media/case-studies/azure-essentials/identity-showcase.gif" \
            "https://images.squarespace-cdn.com/content/${SITE_ID}/687a2682-c653-4b50-a85b-b16d9cf51b4d/AzureEssentials_gif_v1.gif?content-type=image%2Fgif"
          ls -l src/media/case-studies/azure-essentials

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/add-azure-essentials-motion-assets.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/media/case-studies/azure-essentials .github/workflows
          git commit -m "Add Azure Essentials motion assets (event style guide + resource kit gifs, corrected identity showcase); remove one-time workflow"
          git push
